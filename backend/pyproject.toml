[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Backend for Prelegal SaaS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.12.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "litellm>=1.21.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["."]